services:
  x402-recharge-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: x402-recharge-server
    restart: unless-stopped
    env_file:
      - .env
    environment:
      BANKOFAI_ENV: ${BANKOFAI_ENV:-prod}
      HOST: ${HOST:-0.0.0.0}
      PORT: ${PORT:-8000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/mcp',{method:'POST',headers:{'content-type':'application/json','accept':'application/json, text/event-stream'},body:JSON.stringify({jsonrpc:'2.0',id:1,method:'tools/list'})}).then(async r=>{const t=await r.text(); if(!r.ok||!t.includes('recharge')) process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
